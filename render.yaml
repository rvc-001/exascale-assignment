services:
  - type: web
    name: exascale-assignment-1-api
    runtime: python
    rootDir: project/assignment 1
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: exascale-assignment-2-api
    runtime: python
    rootDir: project/assignment 2/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: exascale-assignment-2-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: exascale-assignment-2-db
    plan: free
